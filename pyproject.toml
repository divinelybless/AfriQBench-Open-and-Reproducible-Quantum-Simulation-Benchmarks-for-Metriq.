[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afriqbench"
version = "0.1.0.dev0"
description = "Open and reproducible quantum simulation benchmarks for the Metriq ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Dorcas Attuabea Addo"}
]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
quantum = [
  "qiskit[qasm3-import]>=1.4.3,<3.0",
  "qiskit-aer>=0.17.1,<0.18.0",
  "qiskit-ibm-runtime>=0.41.1,<0.50.0",
  "scipy>=1.16.2,<2.0"
]
mitigation = [
  "mitiq[qiskit]>=1.1.0,<1.2.0"
]
notebook = [
  "pandas>=2.0",
  "matplotlib>=3.8",
  "ipykernel>=6.0"
]
dev = [
  "pytest>=8",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
